  <script>
    (function() {
      var filterPattern = /(?:\[PHANTOM\]|disconnected port object|Failed to send message to service worker|evmAsk|Cannot redefine property: ethereum)/i;
      
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        var file = (e && e.filename) ? e.filename : '';
        if (filterPattern.test(msg) || filterPattern.test(file)) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);

      var origError = console.error;
      console.error = function() {
        var str = Array.prototype.slice.call(arguments).map(function(a) {
          return typeof a === 'string' ? a : (a && a.message ? a.message : (a && typeof a.toString === 'function' ? a.toString() : ''));
        }).join(' ');
        if (filterPattern.test(str)) return;
        return origError.apply(console, arguments);
      };
      var origWarn = console.warn;
      console.warn = function() {
        var str = Array.prototype.slice.call(arguments).map(function(a) {
          return typeof a === 'string' ? a : (a && a.message ? a.message : (a && typeof a.toString === 'function' ? a.toString() : ''));
        }).join(' ');
        if (filterPattern.test(str)) return;
        return origWarn.apply(console, arguments);
      };
    })();
  </script>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('sera_theme');
        var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var initialBg = isDark ? '#000000' : '#F3F4F6';
        var initialColor = isDark ? '#EDEDED' : '#191C1F';
        document.documentElement.style.backgroundColor = initialBg;
        document.documentElement.style.color = initialColor;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        if (isDark) {
          document.documentElement.classList.add('dark', 'dark-mode');
        } else {
          document.documentElement.classList.remove('dark', 'dark-mode');
        }
      } catch (e) {}
    })();
  </script>
